name: novcic-next
services:
  chain-storage:
    image: ghcr.io/foundry-rs/foundry@sha256:043752653d5be351c71709091b3db97c4421c907eb40ea294195e7f532aadf46
    user: "0:0"
    entrypoint: [sh, -c, "chown 1000:1000 /state && chmod 700 /state"]
    volumes: ["chain-data:/state"]
  chain:
    image: ghcr.io/foundry-rs/foundry@sha256:043752653d5be351c71709091b3db97c4421c907eb40ea294195e7f532aadf46
    entrypoint: [sh, /usr/local/bin/start-anvil.sh]
    # Historical EVM snapshots duplicate the full state for every block. They
    # are not block/receipt history: --state still persists both without them.
    # Use the bare --prune-history flag; a numeric value enables snapshots.
    command: [--host, "0.0.0.0", --chain-id, "31337", --timestamp, "${CHAIN_GENESIS_TIMESTAMP:-1704067200}", --no-mining, --state, /state/anvil.json, --state-interval, "1", --prune-history, --silent]
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    depends_on: { chain-storage: { condition: service_completed_successfully } }
    stop_signal: SIGINT
    stop_grace_period: 30s
    ports: ["127.0.0.1:8545:8545"]
    volumes: ["chain-data:/state", "./chain/start-anvil.sh:/usr/local/bin/start-anvil.sh:ro"]
    healthcheck:
      test: [CMD-SHELL, "test -f /tmp/novcic-chain-ready && cast block-number --rpc-url http://127.0.0.1:8545"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: novcic
      POSTGRES_USER: novcic
      POSTGRES_PASSWORD: novcic-local-demo
    ports: ["127.0.0.1:54330:5432"]
    volumes: ["next-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U novcic -d novcic"]
      interval: 3s
      timeout: 3s
      retries: 30
  matching:
    build: { context: ., dockerfile: src/Novcic.Matching/Dockerfile }
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Exchange: Host=db;Database=novcic;Username=novcic;Password=novcic-local-demo
      InternalKey: ${INTERNAL_KEY}
      ChainGeneration: ${CHAIN_GENERATION}
      FaucetEnabled: "false"
    depends_on: { db: { condition: service_healthy } }
    healthcheck:
      test: [CMD, dotnet, Novcic.Matching.dll, --healthcheck]
      interval: 5s
      timeout: 5s
      retries: 30
  custody:
    build: { context: ., dockerfile: src/Novcic.Custody/Dockerfile }
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Exchange: Host=db;Database=novcic;Username=novcic;Password=novcic-local-demo
      InternalKey: ${INTERNAL_KEY}
      MatchingUrl: http://matching:8080
      RpcUrl: http://chain:8545
      CustodyKey: ${CUSTODY_KEY}
      TreasuryKey: ${TREASURY_KEY}
      ChainGeneration: ${CHAIN_GENERATION}
      BTC: ${BTC_CONTRACT}
      USDT: ${USDT_CONTRACT}
    depends_on: { matching: { condition: service_healthy }, chain: { condition: service_healthy } }
  api:
    build: { context: ., dockerfile: src/Novcic.Api/Dockerfile }
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Exchange: Host=db;Database=novcic;Username=novcic;Password=novcic-local-demo
      InternalKey: ${INTERNAL_KEY}
      JwtKey: ${JWT_KEY}
      CookieSecure: "false"
      MatchingUrl: http://matching:8080
      CustodyUrl: http://custody:8080
    depends_on: { matching: { condition: service_healthy } }
    healthcheck:
      test: [CMD, dotnet, Novcic.Api.dll, --healthcheck]
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    build: ./web
    ports: ["127.0.0.1:8081:80"]
    depends_on: { api: { condition: service_healthy } }
volumes:
  next-data:
  chain-data:
