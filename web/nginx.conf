server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # The account route shares its name with Vite's static asset directory.
    # Serve the SPA here rather than redirecting to a directory index.
    location = /assets { try_files /index.html =404; }
    location /api/ { proxy_pass http://api:8080; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /hubs/ { proxy_pass http://api:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; proxy_read_timeout 120s; }
    location / { try_files $uri $uri/ /index.html; }
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
}
